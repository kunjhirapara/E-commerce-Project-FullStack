services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-app:latest
    container_name: ecommerce-app
    restart: unless-stopped
    environment:
      BASE_URL: ${BASE_URL}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - uploads_data:/var/www/html/assets/images/uploads
      - user_uploads_data:/var/www/html/assets/images/user-sign-up-uploads
      - admin_uploads_data:/var/www/html/admin/assets/images/admin-sign-up-uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: ecommerce-web:latest
    container_name: ecommerce-web
    restart: unless-stopped
    volumes:
      - uploads_data:/var/www/html/assets/images/uploads:ro
      - user_uploads_data:/var/www/html/assets/images/user-sign-up-uploads:ro
      - admin_uploads_data:/var/www/html/admin/assets/images/admin-sign-up-uploads:ro
    networks:
      - internal
      - proxy
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: ecommerce-db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --bind-address=0.0.0.0
      - --skip-name-resolve
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecommerce-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to loopback only — reach it via SSH tunnel:
      # ssh -L 8091:127.0.0.1:8091 user@server
      - "127.0.0.1:8091:80"
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: http://localhost:8091/
      UPLOAD_LIMIT: 64M
    networks:
      - internal

volumes:
  db_data:
  uploads_data:
  user_uploads_data:
  admin_uploads_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: proxy
