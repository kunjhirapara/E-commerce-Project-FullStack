server {
    server_name kunjdeveloper.me www.kunjdeveloper.me;

    # Keep your existing root/site config here for the rest of kunjdeveloper.me.

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /projects/Ecommerce {
        return 301 /projects/Ecommerce/;
    }

    location ^~ /projects/Ecommerce/ {
        # Trailing slash strips /projects/Ecommerce/ before forwarding.
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /projects/Ecommerce;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Keep your existing SSL and other site locations below.
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kunjdeveloper.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kunjdeveloper.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name kunjdeveloper.me www.kunjdeveloper.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    listen 80;
    return 301 https://$host$request_uri;
}