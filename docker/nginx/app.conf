server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 12M;

    # Trust X-Forwarded-* headers from Nginx Proxy Manager on the docker network
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Basic security headers (NPM will also inject its own; these are a safety net)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Deny dotfiles (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to PHP includes / sensitive files
    location ~* /(conn|config)\.php$ {
        deny all;
    }
    location ~* /(includes|docker)/ {
        deny all;
    }

    # ---------------------------------------------------------------
    # Defense in depth for user-writable upload directories.
    # Even if an attacker manages to drop a script here, it will NOT
    # be executed by php-fpm — nginx returns 403 first.
    # ---------------------------------------------------------------
    location ~* ^/(?:assets/images/(?:uploads|user-sign-up-uploads)|admin/assets/images/admin-sign-up-uploads)/.+\.(?:php\d*|phtml|phar|pht|phps|sh|cgi|pl|py|rb|asp|aspx|jsp|htaccess|htpasswd)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Inside upload dirs: only serve image/font/document mime types.
    # Anything else (including extensionless files) → 403.
    location ~* ^/(?:assets/images/(?:uploads|user-sign-up-uploads)|admin/assets/images/admin-sign-up-uploads)/ {
        location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|bmp|avif)$ {
            expires 30d;
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location ~ .* {
            deny all;
        }
    }

    # Static assets — long cache
    location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|css|js|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Tell PHP the real scheme so config.php builds https URLs correctly
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 60s;
    }
}
